[workspace]
members  = ["crates/*", "tools/xtask"]
resolver = "3"

[workspace.dependencies]
{{project-name}} = { path = "crates/{{project-name}}", version = "{{project_version}}" }
cargo_metadata = "{{cargo_metadata_version}}"
clap = { version = "{{clap_version}}", features = ["derive"] }
toml_edit = "{{toml_edit_version}}"

[workspace.package]
version      = "{{project_version}}"
edition      = "2024"
rust-version = "{{rust_version}}"
authors      = ["{{author_name}} <{{author_email}}>"]
license      = "{{license}}"
repository   = "https://github.com/{{github_username}}/{{project-name}}"
homepage     = "https://github.com/{{github_username}}/{{project-name}}"
description  = "{{project_description}}"
readme       = "README.md"
keywords     = []
categories   = []

[workspace.metadata.xtask]
crate-prefix  = "{{project-name}}"
primary-crate = "{{project-name}}"

[workspace.lints.rust]
unsafe_code     = "warn"
unreachable_pub = "warn"
missing_docs    = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
too_many_lines          = "allow"

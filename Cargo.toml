[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.dependencies]
{{project-name}} = { path = "crates/{{project-name}}", version = "0.0.0" }

[workspace.package]
version      = "0.0.0"
edition      = "2024"
rust-version = "1.85"
authors      = ["{{author_name}} <{{author_email}}>"]
license      = "{{license}}"
repository   = "https://github.com/{{github_username}}/{{project-name}}"
homepage     = "https://github.com/{{github_username}}/{{project-name}}"
description  = "{{project_description}}"
readme       = "README.md"
keywords     = []
categories   = []

[workspace.metadata.xtask]
public-crate = "{{project-name}}"

[workspace.lints.rust]
unsafe_code     = "warn"
unreachable_pub = "warn"
missing_docs    = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
too_many_lines          = "allow"

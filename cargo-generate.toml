[template]
cargo_generate_version = ">=0.21.0"
# system::command in the post hook requires --allow-commands at the CLI.
# `ignore` prevents files from being copied to the generated project.
# Hook files (hooks/*.rhai) must NOT be in ignore — cargo-generate reads them
# directly before generation. They are excluded from liquid processing only via `exclude`.
ignore = [
    "cargo-generate.toml.bak",
    "TEMPLATE.md",
    "PLAN.md",
    "release.toml",
    "dist-workspace.toml",
    "cliff.toml",
    ".github/workflows/release.yml",
    "LICENSE",
    ".claude",
]

exclude = [
    "hooks/pre-generate.rhai",
    "hooks/post-generate.rhai",
]

[hooks]
pre  = ["hooks/pre-generate.rhai"]
post = ["hooks/post-generate.rhai"]

[placeholders.github_username]
type    = "string"
prompt  = "GitHub username"
regex   = "^[a-zA-Z0-9]([a-zA-Z0-9-]{0,37})?$"

[placeholders.author_name]
type   = "string"
prompt = "Author name"

[placeholders.author_email]
type   = "string"
prompt = "Author email"

[placeholders.project_description]
type    = "string"
prompt  = "One-line description (optional)"
default = ""

[placeholders.include_cli]
type    = "bool"
prompt  = "Include a CLI binary crate?"
default = true

[placeholders.license]
type    = "string"
prompt  = "SPDX license identifier (MIT, Apache-2.0, GPL-3.0, …)"
default = "mit"
regex   = "^(agpl-3\\.0|apache-2\\.0|bsd-2-clause|bsd-3-clause|bsl-1\\.0|cc0-1\\.0|epl-2\\.0|gpl-2\\.0|gpl-3\\.0|lgpl-2\\.1|mit|mpl-2\\.0|unlicense)$"

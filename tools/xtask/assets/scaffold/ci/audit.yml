# generated by cargo xtask; rerun `cargo xtask scaffold ci --preset full` to update
name: Audit

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths: ["**/Cargo.toml", "**/Cargo.lock"]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

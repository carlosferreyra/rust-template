# generated by cargo xtask; rerun `cargo xtask scaffold ci` to update
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          components: clippy,rustfmt
      - run: cargo xtask ci

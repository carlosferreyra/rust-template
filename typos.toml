# Typos linter config. Run `typos` to check, `typos -w` to fix.
# Docs: https://github.com/crate-ci/typos

[default]
extend-ignore-re = [
    # Hex-like identifiers (commit shas, content hashes).
    "[A-Fa-f0-9]{7,}",
]

[default.extend-words]
# Tool names that typos doesn't know.
clippy = "clippy"
rhai = "rhai"

[files]
extend-exclude = [
    "CHANGELOG.md",
    "Cargo.lock",
    "*.snap",
    "scripts/uv.json",
]
